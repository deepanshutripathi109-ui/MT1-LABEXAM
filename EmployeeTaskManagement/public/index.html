
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Task Management</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #172033;
        }

        header {
            background: #233b70;
            color: white;
            padding: 25px;
            text-align: center;
        }

        header h1 {
            margin: 0 0 8px;
        }

        header p {
            margin: 0;
        }

        .container {
            max-width: 1000px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .layout {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 20px;
        }

        .panel {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 3px 12px #00000010;
        }

        h2 {
            margin-top: 0;
        }

        label {
            display: block;
            margin: 12px 0 6px;
            font-weight: bold;
            font-size: 14px;
        }

        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccd3df;
            border-radius: 6px;
            font-size: 14px;
        }

        button {
            padding: 10px 14px;
            border: none;
            border-radius: 6px;
            background: #315fc5;
            color: white;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            opacity: 0.9;
        }

        .form-btn {
            width: 100%;
        }

        .task {
            padding: 15px;
            margin-bottom: 12px;
            border: 1px solid #e1e7f0;
            border-radius: 8px;
        }

        .task h3 {
            margin: 0 0 8px;
        }

        .muted {
            color: #68758b;
            font-size: 14px;
        }

        .status {
            display: inline-block;
            padding: 5px 9px;
            border-radius: 20px;
            background: #fff0ce;
            color: #805800;
            font-size: 12px;
            margin-top: 8px;
        }

        .completed {
            background: #dcf7e7;
            color: #167343;
        }

        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .secondary {
            background: #e8eefb;
            color: #24427f;
        }

        #notice {
            margin-bottom: 15px;
            color: #24427f;
            font-size: 14px;
        }

        .empty {
            text-align: center;
            padding: 20px;
            color: #68758b;
        }

        @media (max-width: 750px) {
            .layout {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <!-- Header -->
    <header>
        <h1>Employee Task Management</h1>
        <p>Manage and track your team's tasks</p>
    </header>

    <div class="container">

        <!-- Success and error messages -->
        <div id="notice" role="status"></div>

        <div class="layout">

            <!-- Task Form -->
            <section class="panel">

                <h2>Add New Task</h2>

                <form id="taskForm">

                    <!-- Task ID -->
                    <label for="taskId">Task ID *</label>
                    <input
                        type="text"
                        id="taskId"
                        placeholder="Enter task ID"
                        required
                    >

                    <!-- Task Name -->
                    <label for="taskName">Task Name *</label>
                    <input
                        type="text"
                        id="taskName"
                        placeholder="Enter task name"
                        maxlength="100"
                        required
                    >

                    <!-- Assigned Employee -->
                    <label for="assignedTo">Assigned To *</label>
                    <input
                        type="text"
                        id="assignedTo"
                        placeholder="Enter employee name"
                        maxlength="80"
                        required
                    >

                    <!-- Task Status -->
                    <label for="status">Task Status *</label>
                    <select id="status" required>
                        <option value="Pending">Pending</option>
                        <option value="In Progress">In Progress</option>
                        <option value="Completed">Completed</option>
                    </select>

                    <!-- Submit Button -->
                    <button
                        type="submit"
                        class="form-btn"
                        id="saveBtn"
                    >
                        Add Task
                    </button>

                </form>

            </section>

            <!-- Task List -->
            <section class="panel">

                <div class="toolbar">
                    <h2>Team Tasks</h2>

                    <button
                        type="button"
                        class="secondary"
                        id="refresh"
                    >
                        Refresh
                    </button>
                </div>

                <div id="tasks">
                    <div class="empty">
                        Loading tasks...
                    </div>
                </div>

            </section>

        </div>
    </div>

    <script>
        // API endpoint of the native Node.js HTTP server
        const API = '/tasks';

        const form = document.getElementById('taskForm');
        const taskList = document.getElementById('tasks');
        const notice = document.getElementById('notice');
        const saveBtn = document.getElementById('saveBtn');

        // Store fetched tasks
        let cachedTasks = [];

        // Display success/error message
        function showMessage(message) {
            notice.textContent = message;
        }

        // Send HTTP requests
        async function apiRequest(url, options = {}) {

            const response = await fetch(url, {
                ...options,
                headers: {
                    'Content-Type': 'application/json',
                    ...(options.headers || {})
                }
            });

            const data = await response.json().catch(() => ({}));

            if (!response.ok) {
                throw new Error(data.error || 'Request failed');
            }

            return data;
        }

        // Escape HTML special characters
        function escapeHTML(value) {
            return String(value ?? '').replace(/[&<>"']/g, char => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            })[char]);
        }

        // GET /tasks
        // Fetch and display all tasks
        async function loadTasks() {

            try {
                cachedTasks = await apiRequest(API);

                if (!Array.isArray(cachedTasks)) {
                    throw new Error('Invalid task data received');
                }

                if (cachedTasks.length === 0) {
                    taskList.innerHTML = `
                        <div class="empty">
                            No tasks available. Add a task!
                        </div>
                    `;
                    return;
                }

                taskList.innerHTML = cachedTasks.map(task => {

                    const completed = task.status === 'Completed';

                    return `
                        <div class="task">

                            <h3>
                                ${escapeHTML(task.taskName)}
                            </h3>

                            <p class="muted">
                                Task ID: ${escapeHTML(task.id)}
                            </p>

                            <p class="muted">
                                Assigned To:
                                ${escapeHTML(task.assignedTo)}
                            </p>

                            <span class="status ${completed ? 'completed' : ''}">
                                ${escapeHTML(task.status)}
                            </span>

                        </div>
                    `;

                }).join('');

            } catch (error) {

                taskList.innerHTML = `
                    <div class="empty">
                        Unable to load tasks.
                    </div>
                `;

                showMessage(error.message);
            }
        }

        // POST /add-task
        // Add a new employee task
        form.addEventListener('submit', async function(event) {

            event.preventDefault();

            // Collect form data
            const task = {
                id: document.getElementById('taskId').value.trim(),
                taskName: document.getElementById('taskName').value.trim(),
                assignedTo: document.getElementById('assignedTo').value.trim(),
                status: document.getElementById('status').value
            };

            if (!task.id || !task.taskName || !task.assignedTo || !task.status) {
                showMessage('Please fill in all required fields.');
                return;
            }

            try {
                saveBtn.disabled = true;

                await apiRequest('/add-task', {
                    method: 'POST',
                    body: JSON.stringify(task)
                });

                showMessage('Task added successfully!');

                form.reset();

                // Refresh task list
                await loadTasks();

            } catch (error) {

                showMessage(error.message);

            } finally {
                saveBtn.disabled = false;
            }
        });

        // Refresh button
        document.getElementById('refresh')
            .addEventListener('click', loadTasks);

        // Load tasks when page opens
        loadTasks();

    </script>

</body>
</html>
